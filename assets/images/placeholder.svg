<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" data-replaced="false">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2744;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc83d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a3a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2744;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="50" cy="30" r="1.2"/><circle cx="120" cy="20" r="0.8"/>
    <circle cx="200" cy="45" r="1"/><circle cx="350" cy="15" r="1.5"/>
    <circle cx="500" cy="25" r="0.9"/><circle cx="650" cy="10" r="1.1"/>
    <circle cx="750" cy="35" r="0.8"/><circle cx="80" cy="60" r="0.7"/>
    <circle cx="300" cy="55" r="1"/><circle cx="700" cy="55" r="1.2"/>
  </g>
  <circle cx="720" cy="70" r="35" fill="#ffc83d" opacity="0.1" filter="url(#softGlow)"/>
  <circle cx="720" cy="70" r="20" fill="#ffc83d" opacity="0.25"/>
  <g transform="translate(180,90)">
    <rect x="40" y="120" width="340" height="230" fill="#1a2744" stroke="#2a3a5c" stroke-width="2"/>
    <polygon points="0,120 210,15 420,120" fill="url(#roofGrad)" stroke="#2a3a5c" stroke-width="2"/>
    <g transform="translate(75,48) rotate(-15,130,40)">
      <rect x="0" y="0" width="270" height="58" fill="#0d1b3e" stroke="#ffc83d" stroke-width="1.5" rx="2"/>
      <g fill="url(#panelGrad)" stroke="#3a6abf" stroke-width="0.5">
        <rect x="5" y="5" width="40" height="22" rx="1"/><rect x="50" y="5" width="40" height="22" rx="1"/>
        <rect x="95" y="5" width="40" height="22" rx="1"/><rect x="140" y="5" width="40" height="22" rx="1"/>
        <rect x="185" y="5" width="40" height="22" rx="1"/><rect x="230" y="5" width="35" height="22" rx="1"/>
        <rect x="5" y="32" width="40" height="21" rx="1"/><rect x="50" y="32" width="40" height="21" rx="1"/>
        <rect x="95" y="32" width="40" height="21" rx="1"/><rect x="140" y="32" width="40" height="21" rx="1"/>
        <rect x="185" y="32" width="40" height="21" rx="1"/><rect x="230" y="32" width="35" height="21" rx="1"/>
      </g>
    </g>
    <g filter="url(#glow)">
      <rect x="60" y="150" width="85" height="70" fill="#ffc83d" opacity="0.8" rx="3"/>
      <line x1="102" y1="150" x2="102" y2="220" stroke="#ff6b35" stroke-width="2"/>
      <line x1="60" y1="185" x2="145" y2="185" stroke="#ff6b35" stroke-width="2"/>
      <rect x="195" y="150" width="85" height="70" fill="#ffc83d" opacity="0.8" rx="3"/>
      <line x1="237" y1="150" x2="237" y2="220" stroke="#ff6b35" stroke-width="2"/>
      <line x1="195" y1="185" x2="280" y2="185" stroke="#ff6b35" stroke-width="2"/>
    </g>
    <rect x="148" y="248" width="58" height="102" fill="#0d1b3e" stroke="#2a3a5c" stroke-width="2" rx="3"/>
    <rect x="153" y="253" width="48" height="45" fill="#ffc83d" opacity="0.35" rx="2"/>
    <circle cx="198" cy="303" r="4" fill="#ffc83d"/>
  </g>
  <rect x="0" y="435" width="800" height="3" fill="#2a3a5c" opacity="0.4"/>
  <ellipse cx="400" cy="437" rx="320" ry="18" fill="#ffc83d" opacity="0.04"/>
  <g transform="translate(590,160)">
    <rect x="0" y="0" width="165" height="90" fill="#0a0e1a" stroke="#ffc83d" stroke-width="1.5" rx="8" opacity="0.92"/>
    <text x="82" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffc83d" opacity="0.7" letter-spacing="2">SOLAR PROJECT</text>
    <text x="82" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ffc83d" font-weight="bold">10 kW</text>
    <text x="82" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff" opacity="0.5">بغداد، العراق</text>
  </g>
  <text x="400" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#ffc83d" opacity="0.35" letter-spacing="3">BILAD AUTO • بلاد أوتو</text>
</svg>
