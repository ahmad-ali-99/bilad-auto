<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(160deg,#12283f 0%,#1a3a5c 55%,#24506f 100%);
 font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#fff;padding:22px;direction:rtl}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.16);
 border-radius:22px;padding:38px 30px 30px;max-width:460px;width:100%;text-align:center;
 box-shadow:0 18px 50px rgba(0,0,0,0.3);backdrop-filter:blur(6px)}

 box-shadow:0 6px 18px rgba(0,0,0,0.25)}
h1{font-size:1.6rem;margin:20px 0 8px;font-weight:800;letter-spacing:0.3px}
.co{font-size:0.95rem;opacity:0.82;margin:0 0 22px}
.msg{font-size:1.05rem;line-height:1.9;margin:0 0 8px}
.sub{font-size:0.92rem;opacity:0.75;line-height:1.8;margin:14px 0 0}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,0.18);overflow:hidden;margin:26px 0 6px}
.bar i{display:block;height:100%;width:38%;border-radius:99px;background:#f5a623;
 animation:run 1.9s ease-in-out infinite}
@keyframes run{0%{margin-inline-start:-38%}100%{margin-inline-start:100%}}
.foot{margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.14);
 font-size:0.85rem;opacity:0.8;line-height:2}
.foot a{color:#ffd479;text-decoration:none}
.dir{direction:ltr;unicode-bidi:isolate;display:inline-block}
</style>

  <h1>البرنامج قيد الصيانة</h1>
  <p class="co">شركة بلاد اوتو للتجارة والمقاولات العامة</p>
  <p class="msg">نعتذر عن التوقف المؤقت — يجري الآن العمل على تحديث البرنامج وتحسينه.</p>
  <div class="bar"><i></i></div>
  <p class="sub">سيعود العمل قريباً بإذن الله. الرجاء عدم إجراء أي عمل على البرنامج
     حتى انتهاء الصيانة.</p>
  <div class="foot">
    للاستفسار:
    <a class="dir" href="tel:07728736250">07728736250</a>
  </div>
</div>

<script>
// **تنظيف الـPWA**: البرنامج مثبّت بتلفونات الموظفين بخدمة عامل (service worker)
// تخدمهم النسخة المخزّنة حتى بلا إنترنت. بلا هذا التنظيف يبقون يشوفون البرنامج
// شغّالاً وما توصلهم صفحة الصيانة أصلاً.
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch (e) { /* التنظيف اختياري — الصفحة تبقى ظاهرة */ }
})();
</script>
